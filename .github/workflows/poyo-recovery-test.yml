name: B STUDIO PoYo Recovery QA
on:
  push:
    branches:
      - feat/bstudio-elite-recovery-qa-20261110
  pull_request:
    paths:
      - "tools/bstudio_poyo_recover.py"
      - "tests/test_bstudio_poyo_recover.py"
      - "tools/poyo_panel_local.py"
      - "tools/bstudio_reel_assemble.py"
      - "tests/test_bstudio_reel_assemble.py"
      - "tests/ffmpeg_smoke.py"
      - "tests/test_bstudio_mac_preflight.py"
      - "tools/bstudio_mac_preflight.py"
      - "browser-tests/**"
      - "playwright.config.cjs"
      - "package.json"
      - ".github/workflows/poyo-recovery-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax validation
        run: python -m py_compile tools/bstudio_poyo_recover.py tools/poyo_panel_local.py tools/bstudio_reel_assemble.py tools/bstudio_mac_preflight.py tests/test_bstudio_poyo_recover.py tests/test_bstudio_reel_assemble.py tests/test_bstudio_mac_preflight.py
      - name: Offline test suite (no API key, no paid calls)
        run: python -m unittest discover -s tests -p 'test_bstudio_*.py' -v
      - name: Verify or install FFmpeg and FFprobe for the audiovisual smoke test
        timeout-minutes: 3
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 update --error-on=any -qq
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Real FFmpeg audiovisual smoke test (synthetic media)
        run: python tests/ffmpeg_smoke.py
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Run real Chromium UI tests
        run: npm run test:ui
      - name: Upload failing browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

