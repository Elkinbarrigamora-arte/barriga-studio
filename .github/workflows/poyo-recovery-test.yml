name: B STUDIO PoYo Recovery QA
on:
  push:
    branches:
      - feat/bstudio-elite-recovery-qa-20261110
  pull_request:
    paths:
      - "tools/bstudio_poyo_recover.py"
      - "tests/test_bstudio_poyo_recover.py"
      - "tools/poyo_panel_local.py"
      - "tools/bstudio_reel_assemble.py"
      - "tests/test_bstudio_reel_assemble.py"
      - "tests/ffmpeg_smoke.py"
      - "browser-tests/**"
      - "playwright.config.cjs"
      - "package.json"
      - ".github/workflows/poyo-recovery-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax validation
        run: python -m py_compile tools/bstudio_poyo_recover.py tools/poyo_panel_local.py tools/bstudio_reel_assemble.py tests/test_bstudio_poyo_recover.py tests/test_bstudio_reel_assemble.py
      - name: Offline test suite (no API key, no paid calls)
        run: python -m unittest discover -s tests -p 'test_bstudio_*.py' -v
      - name: Install FFmpeg and FFprobe for audiovisual smoke test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Real FFmpeg audiovisual smoke test (synthetic media)
        run: python tests/ffmpeg_smoke.py
      - name: Install Playwright test runner
        run: npm install --no-audit --no-fund
      - name: Install Chromium for functional UI checks
        run: npx playwright install --with-deps chromium
      - name: Run real UI tests for controls and project safety
        run: npm run test:ui
      - name: Upload failing browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
