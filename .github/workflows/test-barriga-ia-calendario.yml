name: Pruebas Barriga IA calendario
on:
  pull_request:
    paths:
      - 'tools/barriga_ia_calendario.py'
      - 'tests/test_barriga_ia_calendario.py'
      - '.github/workflows/test-barriga-ia-calendario.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calendario:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ejecutar pruebas unitarias sin redes sociales
        run: python -m unittest discover -s tests -p 'test_barriga_ia_calendario.py' -v
