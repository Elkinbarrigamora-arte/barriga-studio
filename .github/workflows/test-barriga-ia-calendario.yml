name: Pruebas Barriga IA calendario
on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/studio-interfaz.css'
      - 'assets/banner-personajes.svg'
      - 'tests/smoke_studio_chromium.py'
      - 'assets/studio-interfaz.js'
      - 'assets/studio-mejoras.js'
      - 'tests/test_studio_interfaz.py'
      - 'tools/barriga_ia_calendario.py'
      - 'tests/test_barriga_ia_calendario.py'
      - 'tools/barriga_ia_narrativa.py'
      - 'tools/barriga_ia_por_bloques.py'
      - 'tools/barriga_ia_recuperar.py'
      - 'tools/barriga_ia_continuar.py'
      - 'tools/barriga_ia_servicio_local.py'
      - 'tools/puente_local.py'
      - 'tests/test_barriga_ia_servicio_local.py'
      - 'tests/test_barriga_ia_narrativa.py'
      - 'tests/test_barriga_ia_por_bloques.py'
      - 'tests/test_barriga_ia_recuperar.py'
      - 'tests/test_barriga_ia_continuar.py'
      - '.github/workflows/test-barriga-ia-calendario.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calendario:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validar todo el proyecto sin publicar
        run: |
          python -m unittest discover -s tests -v
      - name: Capturar interfaz real en escritorio y móvil
        if: matrix.python-version == '3.11'
        run: python tests/smoke_studio_chromium.py --output evidencia-ui
      - name: Conservar capturas para auditoría
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: studio-ui-evidencia
          path: evidencia-ui/
          if-no-files-found: warn
